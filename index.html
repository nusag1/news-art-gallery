<title>ニュースの絵日記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 美術館の一室：左に今日の1枚を大きく、右に作品名・幸の一言・もとになった見出し。下は月ごとの展示壁（小さな額が並ぶ） */
:root {
  --wall: #eeece7;        /* 展示室の壁 */
  --plinth: #fbfaf7;      /* 台座・カード */
  --ink: #23221f;
  --muted: #6c6860;
  --hair: #d8d4cb;
  --frame: #2b2926;       /* 額縁 */
  --accent: #7a4e9a;      /* すみれ：選択・リンク */
  --accent-soft: #ece4f2;
  --f-disp: "Kaisei Tokumin", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #1b1a19; --plinth: #252321; --ink: #ece8e1; --muted: #a49f96; --hair: #3a3733;
    --frame: #0d0c0b; --accent: #c5a3e0; --accent-soft: #352b3e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #1b1a19; --plinth: #252321; --ink: #ece8e1; --muted: #a49f96; --hair: #3a3733;
  --frame: #0d0c0b; --accent: #c5a3e0; --accent-soft: #352b3e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--wall); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; display: grid; gap: 40px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--hair); padding-bottom: 14px; }
h1 { font-family: var(--f-disp); font-weight: 700; font-size: clamp(26px, 5vw, 38px); letter-spacing: .12em; margin: 0; }
header p { margin: 0; color: var(--muted); font-size: 13px; }

.room { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 820px) { .room { grid-template-columns: minmax(0, 1fr); gap: 22px; } }
.framed { background: var(--frame); padding: clamp(10px, 2.2vw, 22px); box-shadow: 0 18px 40px rgba(0, 0, 0, .22); max-width: 560px; width: 100%; justify-self: center; }
.mat { background: #f7f5f0; padding: clamp(8px, 1.6vw, 16px); }
canvas.main { display: block; width: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
.plate { display: grid; gap: 14px; min-width: 0; }
.date { font-family: var(--f-mono); font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.ptitle { font-family: var(--f-disp); font-size: clamp(24px, 4vw, 32px); line-height: 1.35; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.caption { margin: 0; font-size: 15px; max-width: 34em; overflow-wrap: anywhere; }
.caption .by { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.mood { display: flex; flex-wrap: wrap; gap: 6px; }
.mood span { font-size: 12px; border: 1px solid var(--hair); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 22px; height: 22px; border-radius: 3px; border: 1px solid var(--hair); }
.src h2 { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.src ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.src li { overflow-wrap: anywhere; }
.src .role { display: block; font-size: 12px; color: var(--muted); }
.example { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 2px 8px; justify-self: start; font-weight: 700; }
.nav { display: flex; gap: 8px; }
.nav button { border: 1px solid var(--hair); background: var(--plinth); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.nav button:disabled { opacity: .4; cursor: default; }

.walls { display: grid; gap: 28px; }
.wall h2 { font-family: var(--f-disp); font-size: 20px; margin: 0 0 12px; letter-spacing: .08em; display: flex; gap: 10px; align-items: baseline; }
.wall h2 span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); gap: 14px; }
.thumb { border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 4px; text-align: left; }
.thumb .tf { background: var(--frame); padding: 5px; transition: transform .15s ease; }
.thumb canvas { display: block; width: 100%; aspect-ratio: 4 / 5; background: #f7f5f0; }
.thumb[aria-current="true"] .tf { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .thumb:hover .tf { transform: translateY(-2px); } }
.thumb b { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--muted); }
.thumb span { font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 14px; background: var(--plinth); border: 1px dashed var(--hair); border-radius: 8px; padding: 14px 16px; margin: 0; }
.how { font-size: 13px; color: var(--muted); }
.how summary { cursor: pointer; color: var(--accent); }
.how p { margin: 6px 0 0; max-width: 46em; }
</style>

<div class="wrap">
  <header>
    <h1>ニュースの絵日記</h1>
    <p>毎朝、幸が日経の見出しから描く1枚</p>
  </header>

  <section class="room" aria-label="今日の1枚">
    <div class="framed"><div class="mat"><canvas class="main" id="main" width="800" height="1000" role="img" aria-label="抽象画"></canvas></div></div>
    <div class="plate">
      <span class="example" id="example" hidden>見本（まだ1枚目が届いていません）</span>
      <div class="date" id="date"></div>
      <h2 class="ptitle" id="ptitle">読み込んでいます…</h2>
      <p class="caption" id="caption"></p>
      <div class="mood" id="mood"></div>
      <div class="swatches" id="swatches" aria-label="この絵の色"></div>
      <div class="src" id="src"></div>
      <div class="nav"><button id="prev" data-act="prev">← 前の日</button><button id="next" data-act="next">次の日 →</button></div>
    </div>
  </section>

  <section class="walls" id="walls" aria-label="これまでの絵"></section>

  <details class="how"><summary>この絵の描き方</summary>
    <p>毎朝6時ごろ、幸が日経のトップの見出しを読んで、その日の「気分」を決めます。ニュースごとに形（流れ・にじみ・破片・波・輪・格子・粒）と色を1つずつ当て、ざわつきの強さや密度を変えます。ページはそれをもとに毎回同じ絵を描きます。記事の本文は読んでいません（見出しだけ）。</p>
  </details>
</div>

<script>
// ---------- 描く ----------
// art = { seed, bg, palette:[色…], layers:[{ kind, color, count, size, chaos, alpha }] } を、どの大きさでも同じ絵になるように描く
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexA(hex, a) { const h = String(hex || '#888').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const clamp01 = v => Math.max(0, Math.min(1, +v || 0));
function draw(cv, art) {
  const W = cv.width, H = cv.height, g = cv.getContext('2d'), U = Math.min(W, H);
  const r = rng(art.seed || 1), pal = art.palette && art.palette.length ? art.palette : ['#333'];
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.shadowBlur = 0;
  g.fillStyle = art.bg || '#f4f1ea'; g.fillRect(0, 0, W, H);
  const field = (x, y, chaos, k) => Math.sin(x / W * (2 + chaos * 6) + k) * Math.PI + Math.cos(y / H * (2 + chaos * 7) - k * 1.3) * Math.PI * (0.5 + chaos);
  for (const L of art.layers || []) {
    const col = pal[(L.color ?? 0) % pal.length], n = Math.max(1, Math.min(600, L.count | 0 || 20));
    const size = clamp01(L.size ?? .5), chaos = clamp01(L.chaos ?? .4), alpha = clamp01(L.alpha ?? .6) || .6;
    const k = r() * 10;
    g.save();
    switch (L.kind) {
      case 'flow': {  // 流れ：場に沿って走る線
        g.strokeStyle = hexA(col, alpha * .5); g.lineWidth = U * (0.0015 + size * 0.006); g.lineCap = 'round';
        for (let i = 0; i < n; i++) {
          let x = r() * W, y = r() * H; g.beginPath(); g.moveTo(x, y);
          const steps = 30 + size * 90;
          for (let s = 0; s < steps; s++) { const a = field(x, y, chaos, k); x += Math.cos(a) * U * .008; y += Math.sin(a) * U * .008; g.lineTo(x, y); }
          g.stroke();
        }
        break;
      }
      case 'bloom': {  // にじみ：ぼかした円
        g.globalCompositeOperation = 'multiply';
        for (let i = 0; i < n; i++) {
          const x = r() * W, y = r() * H, rad = U * (0.04 + size * 0.22) * (0.5 + r());
          const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, hexA(col, alpha * .55)); gr.addColorStop(1, hexA(col, 0));
          g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
        }
        break;
      }
      case 'shards': {  // 破片：とがった三角形
        for (let i = 0; i < n; i++) {
          const x = r() * W, y = r() * H, s = U * (0.02 + size * 0.14) * (0.4 + r());
          const a0 = r() * Math.PI * 2; g.fillStyle = hexA(col, alpha * (0.35 + r() * .5));
          g.beginPath(); for (let j = 0; j < 3; j++) { const a = a0 + j * (2.1 + (r() - .5) * chaos * 1.6); g.lineTo(x + Math.cos(a) * s * (j ? 0.35 + chaos * .6 : 1.4), y + Math.sin(a) * s * (j ? 0.35 + chaos * .6 : 1.4)); } g.closePath(); g.fill();
        }
        break;
      }
      case 'waves': {  // 波：横に重なる帯
        g.strokeStyle = hexA(col, alpha * .7); g.lineWidth = U * (0.002 + size * 0.01);
        for (let i = 0; i < n; i++) {
          const y0 = (i + .5) / n * H, amp = H * (0.01 + chaos * .06), fr = 1 + r() * 3 + chaos * 4, ph = r() * 6;
          g.beginPath(); for (let x = 0; x <= W; x += W / 120) g.lineTo(x, y0 + Math.sin(x / W * fr * Math.PI * 2 + ph) * amp * (0.6 + Math.sin(x / W * 3 + k) * .4)); g.stroke();
        }
        break;
      }
      case 'rings': {  // 輪：中心から広がる弧
        const cx = W * (0.2 + r() * .6), cy = H * (0.2 + r() * .6);
        g.strokeStyle = hexA(col, alpha * .8);
        for (let i = 0; i < n; i++) {
          const rad = U * (0.03 + (i / n) * (0.3 + size * .5)); g.lineWidth = U * (0.001 + size * .005) * (1 + r());
          const a0 = r() * Math.PI * 2, len = Math.PI * (0.3 + (1 - chaos) * 1.6 * r());
          g.beginPath(); g.arc(cx, cy, rad, a0, a0 + len); g.stroke();
        }
        break;
      }
      case 'grid': {  // 格子：くずれた四角
        const cols = Math.max(2, Math.round(3 + size * 10)), cw = W / cols, rows = Math.round(H / cw);
        for (let i = 0; i < n; i++) {
          const cx = Math.floor(r() * cols), cy = Math.floor(r() * rows), j = chaos * cw * .35;
          g.fillStyle = hexA(col, alpha * (0.25 + r() * .6));
          g.save(); g.translate(cx * cw + cw / 2 + (r() - .5) * j, cy * cw + cw / 2 + (r() - .5) * j); g.rotate((r() - .5) * chaos * .8);
          const s = cw * (0.5 + r() * .45); g.fillRect(-s / 2, -s / 2, s, s); g.restore();
        }
        break;
      }
      case 'grain': {  // 粒：細かい点
        g.fillStyle = hexA(col, alpha * .6);
        for (let i = 0; i < n * 20; i++) { const s = U * (0.0012 + size * .004) * r(); g.fillRect(r() * W, r() * H, s, s); }
        break;
      }
      case 'sun': {  // 大きな丸：その日いちばんの出来事
        const x = W * (0.25 + r() * .5), y = H * (0.2 + r() * .45), rad = U * (0.12 + size * .25);
        g.fillStyle = hexA(col, alpha); g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
        if (chaos > .3) { g.strokeStyle = hexA(col, alpha * .5); g.lineWidth = U * .003; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (r() - .5) * chaos * rad * .4, y + (r() - .5) * chaos * rad * .4, rad * (1.08 + i * .07), 0, Math.PI * 2); g.stroke(); } }
        break;
      }
    }
    g.restore();
  }
  // 紙の手ざわり
  const r2 = rng((art.seed || 1) ^ 0x9e3779b9);
  g.fillStyle = 'rgba(0,0,0,0.035)';
  for (let i = 0; i < W * H / 260; i++) g.fillRect(r2() * W, r2() * H, 1, 1);
}

// ---------- データと表示 ----------
const KIND_L = { flow: '流れ', bloom: 'にじみ', shards: '破片', waves: '波', rings: '輪', grid: '格子', grain: '粒', sun: '大きな丸' };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const SAMPLE = {
  id: 'sample', date: '', title: '静かな雨と、遠くの火花', mood: ['しずか', 'ざわつき少し'],
  caption: '見本の絵です。毎朝、幸がその日の見出しから1枚描くと、ここに今日の絵が出ます。',
  art: { seed: 20261019, bg: '#efe9dc', palette: ['#3d5a80', '#98c1d9', '#ee6c4d', '#293241', '#e0c097'],
    layers: [{ kind: 'bloom', color: 1, count: 14, size: .7, alpha: .7 }, { kind: 'waves', color: 0, count: 18, size: .3, chaos: .35, alpha: .6 }, { kind: 'shards', color: 2, count: 16, size: .25, chaos: .8, alpha: .8 }, { kind: 'grain', color: 3, count: 40, size: .4, alpha: .5 }] },
  sources: [],
};
const S = { days: [], cur: null, sample: true };
const $ = s => document.querySelector(s);
const fmtDate = s => { const d = new Date(s + 'T00:00'); return isNaN(d) ? '' : `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}（${WD[d.getDay()]}）`; };

function sizeCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(160, Math.round(r.width * dpr)) || 800;
  cv.width = w; cv.height = Math.round(w * 1.25);
}
function show(d) {
  S.cur = d.id;
  $('#example').hidden = d.id !== 'sample';
  $('#date').textContent = d.date ? fmtDate(d.date) : '';
  $('#ptitle').textContent = d.title || '無題';
  $('#caption').innerHTML = '';
  $('#caption').append(document.createTextNode(d.caption || ''));
  if (d.id !== 'sample') { const by = document.createElement('span'); by.className = 'by'; by.textContent = '― 幸'; $('#caption').append(by); }
  const kinds = [...new Set((d.art.layers || []).map(l => KIND_L[l.kind]).filter(Boolean))];
  $('#mood').innerHTML = [...(d.mood || []), ...kinds].map(m => `<span>${esc(m)}</span>`).join('');
  $('#swatches').innerHTML = (d.art.palette || []).map(c => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join('');
  const src = d.sources || [];
  $('#src').innerHTML = src.length ? `<h2>もとになった見出し</h2><ol>${src.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}${s.role ? `<span class="role">${esc(s.role)}</span>` : ''}</li>`).join('')}</ol>` : '';
  const cv = $('#main'); sizeCanvas(cv); draw(cv, d.art);
  $('#main').setAttribute('aria-label', `抽象画「${d.title || '無題'}」`);
  const i = S.days.findIndex(x => x.id === d.id);
  $('#prev').disabled = i < 0 || i >= S.days.length - 1; $('#next').disabled = i <= 0;
  document.querySelectorAll('.thumb').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === d.id)));
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderWalls() {
  const box = $('#walls');
  if (!S.days.length) { box.innerHTML = '<p class="empty">まだ絵がありません。明日の朝から、毎日1枚ずつここに並びます。</p>'; return; }
  const months = new Map();
  for (const d of S.days) { const m = d.date.slice(0, 7); if (!months.has(m)) months.set(m, []); months.get(m).push(d); }
  box.innerHTML = [...months].map(([m, ds]) => `<div class="wall"><h2>${+m.slice(0, 4)}年${+m.slice(5)}月<span>${ds.length}枚</span></h2><div class="thumbs">${ds.map(d => `<button class="thumb" data-id="${esc(d.id)}" aria-current="${d.id === S.cur}" aria-label="${esc(fmtDate(d.date))}「${esc(d.title)}」"><div class="tf"><canvas width="224" height="280"></canvas></div><b>${esc(d.date.slice(5).replace('-', '/'))}</b><span>${esc(d.title)}</span></button>`).join('')}</div></div>`).join('');
  box.querySelectorAll('.thumb').forEach(b => { const d = S.days.find(x => x.id === b.dataset.id); if (d) draw(b.querySelector('canvas'), d.art); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],.thumb'); if (!t) return;
  if (t.classList.contains('thumb')) { const d = S.days.find(x => x.id === t.dataset.id); if (d) { show(d); window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } return; }
  const i = S.days.findIndex(x => x.id === S.cur);
  if (t.dataset.act === 'prev' && i < S.days.length - 1) show(S.days[i + 1]);
  if (t.dataset.act === 'next' && i > 0) show(S.days[i - 1]);
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const d = S.days.find(x => x.id === S.cur) || SAMPLE; const cv = $('#main'); sizeCanvas(cv); draw(cv, d.art); }, 200); });

show(SAMPLE); renderWalls();
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) {
    // 公開版（GitHub Pages）：同じフォルダの days.json を読む
    try {
      const r = await fetch('days.json', { cache: 'no-cache' }); if (!r.ok) throw 0;
      S.days = (await r.json()).filter(d => d.art && d.date).map(d => ({ id: d.date, ...d })).sort((a, b) => b.date.localeCompare(a.date));
      renderWalls(); show(S.days[0] || SAMPLE);
    } catch (e) { $('#walls').innerHTML = '<p class="empty">絵のデータを読み込めませんでした。少し時間をおいて開き直してください。</p>'; }
    return;
  }
  db.collection('days').onSnapshot(snap => {
    const keep = S.cur;
    S.days = snap.docs.map(x => ({ id: x.id, ...x.data() })).filter(d => d.art && d.date).sort((a, b) => b.date.localeCompare(a.date));
    renderWalls();
    const d = S.days.find(x => x.id === keep) || S.days[0];
    show(d || SAMPLE);
  }, () => {});
})();
</script>
